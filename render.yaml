# Render Blueprint — Subway Saci
# O backend serve a API + o frontend estático (serviço único).
# As 3 chaves do Supabase são marcadas como "sync: false" → você as define
# no painel do Render (nunca ficam no repositório).
services:
  - type: web
    name: subway-saci
    runtime: node
    plan: free
    # Sem rootDir: assim mudanças no frontend/ TAMBÉM disparam auto-deploy.
    # `npm ci` (não `npm install`): instala EXATAMENTE o que está no
    # package-lock.json (inclui a versão pinada+integridade do xlsx da
    # distribuição oficial do SheetJS e os `overrides` de qs/body-parser).
    # Deploy reproduzível; nunca "resolve" uma versão diferente no build.
    buildCommand: cd backend && npm ci
    # `exec node` (NUNCA `npm start`): o Render encerra a instância com SIGTERM no processo do start command.
    # O npm não repassa o sinal ao Node — o backend seguia rodando (inclusive o poller do iFood Events) até o
    # SIGKILL, sem encerramento gracioso e sem liberar o lease. Com `exec`, o Node É o processo que recebe o sinal.
    startCommand: cd backend && exec node src/server.js
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DEFAULT_ORG_ID
        value: "00000000-0000-0000-0000-000000000001"
      - key: DEFAULT_UNIDADE_ID
        value: "00000000-0000-0000-0000-0000000000a1"
      # --- Integração iFood (nomes apenas; valores no painel do Render) ------
      # IFOOD_TOKEN_SECRET cifra os tokens do iFood em repouso (AES-256-GCM).
      # Gere com: openssl rand -base64 48. Trocar o valor invalida os tokens
      # já gravados (basta reconectar).
      - key: IFOOD_TOKEN_SECRET
        sync: false
      - key: IFOOD_API_BASE_URL
        value: "https://merchant-api.ifood.com.br"
      - key: IFOOD_ANALYTICS_CLIENT_ID
        sync: false
      - key: IFOOD_ANALYTICS_CLIENT_SECRET
        sync: false
      - key: IFOOD_FINANCIAL_CLIENT_ID
        sync: false
      - key: IFOOD_FINANCIAL_CLIENT_SECRET
        sync: false
      # IFOOD_HOMOLOGATION_MODE / IFOOD_TEST_CLIENT_* NÃO entram aqui: são só
      # para desenvolvimento local (ver backend/.env.example).
