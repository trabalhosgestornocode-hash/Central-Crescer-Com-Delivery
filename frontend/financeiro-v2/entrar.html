<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Financeiro v2 — entrar (homologação sintética)</title>
  <link rel="stylesheet" href="/fv2.css">
</head>
<body>
  <main id="conteudo" class="entrar">
    <h1>Financeiro v2 — homologação local</h1>
    <p class="aviso">Ambiente de <strong>homologação sintética</strong>: identidades e dados fictícios. Não é o login da plataforma.</p>
    <form id="form-entrar" autocomplete="off">
      <label>Usuário <input name="login" required maxlength="60" autocomplete="username"></label>
      <label>Senha <input name="senha" type="password" required maxlength="200" autocomplete="current-password"></label>
      <label>Segundo fator (se houver) <input name="segundoFator" inputmode="numeric" maxlength="20"></label>
      <button type="submit">Entrar</button>
      <p id="mensagem" role="alert" aria-live="assertive"></p>
    </form>
  </main>
  <script type="module" src="/entrar.js"></script>
</body>
</html>
