<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1013"/>
      <stop offset="1" stop-color="#070304"/>
    </linearGradient>
    <filter id="brilho" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="5" y="5" width="118" height="118" rx="26" fill="url(#fundo)"/>
  <rect x="5" y="5" width="118" height="118" rx="26" fill="none" stroke="#ff2536" stroke-width="3.5" filter="url(#brilho)"/>
  <!-- mostrador: régua de 270° com zonas -->
  <g fill="none" stroke-linecap="round" stroke-width="8">
    <path d="M38.3 88.3 A36 36 0 0 1 36.6 45.3" stroke="#3ddc97"/>
    <path d="M40.5 39.6 A36 36 0 0 1 83.5 36.6" stroke="#ffc24b"/>
    <path d="M89.2 40.9 A36 36 0 0 1 89.7 88.3" stroke="#ff2536" filter="url(#brilho)"/>
  </g>
  <!-- ponteiro -->
  <path d="M64 64 L82 44" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="8" fill="#ffffff"/>
  <circle cx="64" cy="64" r="3.2" fill="#ff2536"/>
  <!-- pulso da operação -->
  <path d="M30 104 H50 L56 94 L63 112 L70 98 L74 104 H98" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>
</svg>
